<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            background-color: slategrey;
            height: 97vh;
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(159, 142, 121);
            font-size: 70px;
        }

        .teacher {
          grid-column: span 2;
          background-color:bisque;
        }

        .scientist {
          grid-column: span 2;
          background-color: rgb(109, 89, 61);
        }

        .programmer {
          grid-row: span 2;
          /* grid-column-start: -2;
          grid-column-end: -1;
          grid-row-start:  -3;
          grid-row-end:  -1; */
          grid-area: -3/-2/-1/-1;
          background-color: rgb(0, 0, 122);
        }
    </style>
    <title>grid-placement</title>
</head>

<body>
    <div class="container">
        <div class="item teacher">👨🏼‍🏫</div>
        <div class="item scientist">👩🏼‍🔬</div>
        <div class="item programmer">👨🏼‍💻</div>
    </div>
</body>

</html>
