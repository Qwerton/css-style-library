<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прямоугольник и круг</title>

  <style>

    body{
      background-color: #999;
    }

    .circle {
      width: 80px;
      height: 80px;
      background-color: aqua;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .rectangle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 100px;
      background-color: blue;
    }
  </style>
</head>

<body>

  <div class="circle"></div>
  <div class="rectangle"></div>

</body>

</html>
