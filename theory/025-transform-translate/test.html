<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test</title>
  <style>
    .hover-scale {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100px;
    height: 100px;
    background-color: blue;
    transition: 0.5s ease;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }

  .hover-scale:hover {
    width: 120px;
    height: 120px;
    transition: 0.5s ease;
    cursor: pointer;
  }
  </style>
</head>
<body>
  <div class="hover-scale"></div>
</body>
</html>
