<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .menu {
          display: flex;
          justify-content: flex-start;
          list-style: none;
          padding-left: 10px;
        }
        .menu li {
          margin-right: 20px;
          padding: 15px;
          border-radius: 7px;
          background-color: bisque;
          transition: .3s;
        }

        li:hover {
          color: red;
          box-shadow: 3px 3px 10px rgb(190, 190, 190);
          cursor: pointer;
          transition: .3s;
        }

    </style>
    <title>Flex-список меню</title>
</head>

<body>
    <ul class="menu">
        <li>Главная</li>
        <li>О&nbsp;нас</li>
        <li>Услуги</li>
        <li>Портфолио</li>
        <li>Контакты</li>
    </ul>
</body>

</html>
