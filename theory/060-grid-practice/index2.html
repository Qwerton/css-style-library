<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
      body {
        margin: 0;
        background-color: rgb(248, 232, 201);
        display: grid;
        height: 100vh;
        grid-template-rows: 100px 1fr 100px;
        grid-template-columns: minmax(100px, 200px) 1fr;
      }

      .header {
        background-color: gray;
        color: white;
        grid-column: span 2;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .aside {
        background-color: rgb(78, 78, 78);
        color: rgb(212, 212, 212);
        padding: 10px;
      }

      .main {
        background-color: rgb(214, 214, 214);
        display: grid;
        padding: 20px;
        gap: 20px;
        grid-template-columns: repeat(3, 1fr);
      }

      .section {
        background-color: rgb(233, 233, 233);
        box-shadow: 3px 3px 10px rgb(196, 196, 196);
        padding: 10px;
        border-radius: 10px;
      }

      .footer {
        background-color: gray;
        color: white;
        grid-column: span 2;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 1000px) {
        .main {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 768px) {
        .main {
          grid-template-columns: 1fr;
        }
      }

    </style>
</head>

<body>
    <div class="header">Header</div>
    <div class="aside">Side Panel</div>
    <div class="main">
        <div class="section">Content Section 1</div>
        <div class="section">Content Section 2</div>
        <div class="section">Content Section 3</div>
    </div>
    <div class="footer">Footer</div>
</body>

</html>
